# 구인 메일 Agent — 멀티 컨테이너 구성
#   db        : PostgreSQL 16 + pgvector (데이터는 pgdata 볼륨에 영구 보관)
#   backend   : Python — 메일 수집·파싱·임베딩 후 DB 저장 (실행이 끝나면 종료되는 작업형)
#   dashboard : Next.js 대시보드 (공고 조회·상태 버튼·삭제·RAG 챗봇)
#
# 실행:  docker compose up --build
# 사전:  .env 파일에 API 키·Gmail 설정이 들어 있어야 함 (README 참고)

name: job-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-jobagent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobagent}
      POSTGRES_DB: ${DB_NAME:-job_agent}
    ports:
      # 호스트 5433 → 컨테이너 5432. (Homebrew PostgreSQL이 5432를 쓰고 있어도 충돌하지 않게 5433 사용)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data          # 데이터 영구 보관 (컨테이너를 지워도 유지)
      - ./db/init:/docker-entrypoint-initdb.d:ro # 최초 기동 시 스키마 자동 생성
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    env_file: .env                # API 키·Gmail 설정은 이미지에 굽지 않고 실행 시 주입
    environment:
      DB_HOST: db                 # 컨테이너끼리는 localhost가 아니라 "서비스 이름"으로 접속
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-jobagent}
      DB_PASSWORD: ${DB_PASSWORD:-jobagent}
      DB_NAME: ${DB_NAME:-job_agent}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy   # DB가 준비된 뒤에 시작
    volumes:
      - ./reports:/app/reports       # daily_report.py가 만드는 리포트를 호스트에서도 볼 수 있게
    restart: "no"                    # 한 번 수집하고 끝나는 작업형 서비스

  dashboard:
    build: ../job_dashboard
    environment:
      # 대시보드에는 필요한 값만 전달 (Gmail 비밀번호 등은 넘기지 않음 — 최소 권한)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-jobagent}
      DB_PASSWORD: ${DB_PASSWORD:-jobagent}
      DB_NAME: ${DB_NAME:-job_agent}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
